[theme]
base = "dark"
primaryColor = "#27D3F1"
backgroundColor = "#080F21"
secondaryBackgroundColor = "#111E34"
textColor = "#F4F7FC"
font = "sans serif"
# El espacio superior del área principal (para despejar la barra de Share/Fork/GitHub
# de Streamlit Community Cloud) se fija en app.py (".block-container { padding-top }"),
# porque esa regla CSS propia tiene prioridad sobre este valor de tema y lo anula.

[theme.sidebar]
# Sin esto, el sidebar (logo + navegación) hereda el mismo paddingTop de arriba y
# queda empujado muy abajo. Se lo deja con un espaciado normal, independiente del
# área principal.
paddingTop = "1rem"

[client]
# Oculta el menú propio de la app (Deploy, Rerun, etc.). No controla la barra de
# Fork/GitHub de Streamlit Community Cloud: esa la agrega la plataforma, no la app.
toolbarMode = "minimal"
